name: Release

# Cutting a release is pushing a tag. Everything below follows from that, so
# there is exactly one action to remember and no build step anybody has to run
# on their own machine:
#
#     npm run version 1.2.3 && git commit -am "v1.2.3" && git tag -a v1.2.3 -m v1.2.3 && git push --follow-tags
#
# The tag is annotated because `--follow-tags` pushes annotated tags and only
# those. With a lightweight `git tag v1.2.3` the commit goes up, the tag stays
# home, and nothing builds — silently, since the push itself succeeds.
on:
  push:
    tags: ["v*"]
  # Useful for re-running a release whose upload failed, without moving a tag.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build"
        required: true

# Necessary but not sufficient: the token is also capped by the repository's
# default workflow permission, and with that set to read-only, creating the
# release object returns "Resource not accessible by integration" even though
# the job reports `Contents: write` — after all five platforms have built.
# Attaching assets to a release that already exists still works, which is what
# makes the failure look like a fluke. Settings → Actions → General → Workflow
# permissions must be "Read and write".
permissions:
  contents: write

jobs:
  # The version lives in three files and the tag is a fourth claim about it.
  # Finding out they disagree after four platforms have built is a waste of
  # twenty minutes, so it is checked first and alone.
  verify:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: pick
        run: echo "tag=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"
      - name: Versions agree with the tag
        run: node scripts/check-version.mjs "${{ steps.pick.outputs.tag }}"

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple silicon and Intel are separate binaries, not one build with
          # two names — a universal binary would double every download for
          # everybody, so they ship apart.
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macOS (Apple silicon)
          - platform: macos-latest
            target: x86_64-apple-darwin
            label: macOS (Intel)
          # Pinned to the oldest runner the toolchain still supports: the glibc
          # a binary is built against is the *minimum* it will run on, so
          # building on a newer Ubuntu would quietly drop older distributions.
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: Linux (x86_64)
          # Native arm64, not cross-compiled: Tauri's Linux bundling shells out
          # to tools that expect to be running on the target architecture.
          # Arm Linux desktops are no longer unusual — the machine this was
          # developed on is one.
          - platform: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            label: Linux (arm64)
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows

    runs-on: ${{ matrix.platform }}
    name: ${{ matrix.label }}

    # The key the in-app updater trusts, as a repository secret. Without it the
    # release still builds and publishes — only the updater's signed artifacts
    # and `latest.json` are left out, so installed copies simply hear of nothing.
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - name: System dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            patchelf \
            build-essential \
            file \
            xdg-utils

      - run: npm ci

      - run: npm test

      # Switched on here rather than in `tauri.conf.json`, so a local
      # `tauri build` without the key still works.
      - name: Produce signed updater artifacts
        if: env.TAURI_SIGNING_PRIVATE_KEY != ''
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const file = "src-tauri/tauri.conf.json";
            const config = JSON.parse(fs.readFileSync(file, "utf8"));
            config.bundle.createUpdaterArtifacts = true;
            fs.writeFileSync(file, JSON.stringify(config, null, 2));
          '

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ needs.verify.outputs.tag }}
          releaseName: jterm ${{ needs.verify.outputs.tag }}
          # Written once, by the first job to arrive; the rest attach their
          # assets to the release it created.
          releaseBody: |
            Download the build for your platform below.

            These binaries are **not code-signed**. macOS will say the app "cannot
            be opened because the developer cannot be verified" — right-click the
            app and choose Open, then Open again. Windows SmartScreen will show
            "Windows protected your PC" — choose More info, then Run anyway.

            See https://jacobfv.github.io/jterm/ for details.
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}

  # A copy installed from a `.deb` or `.rpm` updates from one, and the updater
  # only installs a package whose signature checks out. The bundler signs only
  # what it can replace itself — AppImage, `.app`, `.msi`, NSIS — so the Linux
  # packages are signed here, once every platform has uploaded, and `latest.json`
  # gains the `linux-<arch>-deb` / `-rpm` entries the updater looks for first.
  # See `scripts/sign-linux-packages.mjs`.
  linux-packages:
    needs: [verify, build]
    runs-on: ubuntu-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.verify.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Sign the Linux packages for the updater
        if: env.TAURI_SIGNING_PRIVATE_KEY != ''
        run: |
          npm ci --ignore-scripts
          mkdir packages
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir packages \
            --pattern '*.deb' --pattern '*.rpm' --pattern 'latest.json'
          node scripts/sign-linux-packages.mjs packages \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            packages/*.deb.sig packages/*.rpm.sig packages/latest.json
